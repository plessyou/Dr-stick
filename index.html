<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stickaufträge</title>
<link rel="manifest" id="manifestLink" href="./manifest.webmanifest?v=6" type="application/manifest+json">
<link rel="apple-touch-icon" id="appleIcon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192-v6.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512-v6.png">
<link rel="shortcut icon" href="./favicon.ico">
<meta name="app-version" content="6">
<meta name="theme-color" content="#f3f4f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Stickaufträge">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stickaufträge">
<meta name="description" content="Übersicht über Stickaufträge – Motiv, Textil, Garn, Deadline, Bezahlung.">
<style>
  :root{
    --stoff:#f3f4f1; --karte:#ffffff; --tinte:#23262b; --tinte-2:#5c6168; --linie:#dcded8;
    --garn-blau:#37518f; --garn-gelb:#c99a3a; --garn-gruen:#4a7c59; --garn-grau:#a2a7ad;
    --beere:#b03a48; --lila:#7a4fa3;
    --radius:14px;
    --schatten:0 1px 2px rgba(35,38,43,.06), 0 6px 18px rgba(35,38,43,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--stoff); color:var(--tinte);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:15.5px; line-height:1.45; padding-bottom:96px;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--garn-blau); outline-offset:2px; border-radius:6px;
  }

  .kopf{padding:20px 18px 10px}
  .kopf h1{margin:0; font-family:Georgia,'Times New Roman',serif; font-style:italic; font-weight:600; font-size:30px; letter-spacing:.2px}
  .kopf .unterzeile{margin:2px 0 0; color:var(--tinte-2); font-size:13px}
  .laufstich{height:0; border-top:2px dashed var(--garn-blau); opacity:.5; margin:12px 18px 0}

  .chips{display:flex; gap:8px; padding:12px 18px 4px; overflow-x:auto; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; padding:7px 13px; border-radius:999px;
    border:1px solid var(--linie); background:var(--karte);
    font-size:13.5px; color:var(--tinte-2); white-space:nowrap;
  }
  .chip b{color:var(--tinte); font-weight:600}
  .chip.aktiv{background:var(--tinte); border-color:var(--tinte); color:#fff}
  .chip.aktiv b{color:#fff}
  .werkzeuge{display:flex; flex-wrap:wrap; gap:8px; padding:8px 18px 0}
  .wz{
    display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px;
    border:1px solid var(--linie); background:transparent; font-size:12.5px; color:var(--tinte-2); white-space:nowrap;
  }
  .wz b{color:var(--tinte); font-weight:600}
  .wz.stark{border-color:var(--garn-blau); color:var(--garn-blau)}
  #wzInstallieren[hidden]{display:none}

  /* ── Ordner ───────────────────────────── */
  .liste{padding:8px 18px 0}
  .ordner{margin-bottom:6px}
  .ordner-kopf{display:flex; align-items:baseline; gap:9px; padding:14px 2px 6px}
  .ordner-titel{display:flex; align-items:baseline; gap:9px; flex:1; min-width:0; text-align:left}
  .ordner-pfeil{flex:0 0 auto; font-size:11px; color:var(--tinte-2); width:12px}
  .ordner-name{
    font-family:Georgia,serif; font-style:italic; font-size:17px; font-weight:600;
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .ordner-zahl{flex:0 0 auto; font-size:11.5px; color:var(--tinte-2)}
  .ordner-mehr{flex:0 0 auto; padding:2px 8px; color:var(--tinte-2); font-size:17px; line-height:1}
  .ordner-linie{height:0; border-top:1px dashed var(--linie); margin:0 2px 10px}
  .ordner.erledigt .ordner-name, .ordner.erledigt .ordner-pfeil{color:var(--garn-gruen)}
  .ordner-inhalt{display:flex; flex-direction:column; gap:12px; border-radius:12px; padding:2px}
  .ordner-inhalt.drueber{outline:2px dashed var(--garn-blau); outline-offset:1px; background:#eaeef7}
  .ordner-leer{
    padding:16px 14px; border:1px dashed var(--linie); border-radius:12px;
    font-size:13px; color:var(--tinte-2); text-align:center;
  }

  /* ── Karten ───────────────────────────── */
  .karte{
    display:flex; align-items:flex-start; width:100%;
    background:var(--karte); border-radius:var(--radius); box-shadow:var(--schatten); overflow:hidden;
  }
  .karte.frisch{box-shadow:0 0 0 2px var(--garn-blau), var(--schatten)}
  .karte.zieh-quelle{opacity:.35}
  .karte.zieh{
    position:fixed; z-index:70; pointer-events:none; opacity:.95;
    box-shadow:0 12px 28px rgba(35,38,43,.28); transform:rotate(-1deg);
  }
  .garnstrang{flex:0 0 9px; align-self:stretch; background:repeating-linear-gradient(-55deg, var(--g1) 0 3px, var(--g2) 3px 6px)}
  .karte-spalte{flex:1; min-width:0; display:flex; flex-direction:column; align-self:stretch}
  .karte-flaeche{flex:1; text-align:left; padding:12px 12px 10px 14px; min-width:0; display:block; width:100%}
  .karte-flaeche:active{opacity:.7}
  .person{font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:18.5px; font-weight:600; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .motiv{color:var(--tinte-2); font-size:14px; margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .banderole{display:block; margin-top:7px; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--tinte-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .karte-fuss{display:flex; align-items:center; gap:6px; margin-top:9px; flex-wrap:wrap}
  .meta{display:block; margin-top:8px; font-size:11.5px; color:var(--tinte-2); opacity:.8}
  .marke{display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:3px 9px; border-radius:999px; background:var(--stoff); color:var(--tinte-2); white-space:nowrap}
  .marke .punkt{width:7px;height:7px;border-radius:50%;background:currentColor}
  .marke.frist-warn{background:#f7e9d8; color:#8a5a17}
  .marke.frist-rot{background:#f6e3e5; color:var(--beere); font-weight:600}
  .marke.keine-frist{background:#f2ecf7; color:var(--lila); font-weight:600; border:1px dashed var(--lila)}
  .thumb{flex:0 0 auto; width:92px; height:92px; margin:12px 12px 0 0; border-radius:10px; object-fit:contain; background:var(--stoff)}

  .karte-aktion{display:flex; align-items:center; gap:8px; padding:8px 12px 10px 14px; border-top:1px dashed var(--linie); flex-wrap:wrap}
  .akt-knopf{
    display:inline-flex; align-items:center; gap:7px; padding:6px 11px; border-radius:999px;
    border:1px solid var(--linie); background:var(--karte); font-size:12.5px; color:var(--tinte-2); white-space:nowrap;
  }
  .akt-knopf:active{opacity:.55}
  .akt-knopf .punkt{width:8px; height:8px; border-radius:50%; background:currentColor}
  .akt-knopf.gezahlt{color:var(--garn-gruen); border-color:#bcd3c2; background:#f2f7f3; font-weight:600}
  .akt-knopf.geschenk{color:var(--garn-blau); border-color:#c3cde4; background:#eef1f8; font-weight:600}
  .mini-box{
    flex:0 0 auto; width:18px; height:18px; border-radius:5px; border:2px solid var(--linie);
    background:var(--karte); display:flex; align-items:center; justify-content:center;
    font-size:11px; line-height:1; color:transparent;
  }
  .akt-knopf.gezahlt .mini-box{background:var(--garn-gruen); border-color:var(--garn-gruen); color:#fff}
  .griff{max-width:52%; min-width:0; touch-action:none; cursor:grab}
  .griff .punkte{flex:0 0 auto; letter-spacing:-1px; opacity:.6}
  .griff .txt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .betrag-rechts{margin-left:auto; font-size:12.5px; color:var(--tinte-2)}

  .leer{padding:56px 30px; text-align:center; color:var(--tinte-2)}
  .leer .rahmen{width:88px; height:88px; margin:0 auto 16px; border-radius:50%; border:3px solid #c8b089; display:flex; align-items:center; justify-content:center}
  .leer .rahmen .innen{width:64px; height:64px; border-radius:50%; border:2px dashed var(--garn-blau); opacity:.55}
  .leer p{margin:0 0 4px; font-size:15px}
  .leer .klein{font-size:13px}

  .fab{
    position:fixed; right:18px; bottom:22px; z-index:20; width:58px; height:58px; border-radius:50%;
    background:var(--garn-blau); color:#fff; font-size:30px; line-height:1;
    box-shadow:0 6px 16px rgba(55,81,143,.4); display:flex; align-items:center; justify-content:center;
  }
  .fab:active{transform:scale(.95)}

  /* ── Sheets ───────────────────────────── */
  .sheet{position:fixed; inset:0; z-index:30; background:var(--stoff); display:none; flex-direction:column}
  #sheetForm{z-index:40}
  .sheet.offen{display:flex}
  .sheet-kopf{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--linie); background:var(--karte); position:sticky; top:0; z-index:2}
  .sheet-kopf h2{margin:0; flex:1; font-family:Georgia,serif; font-style:italic; font-size:20px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .zurueck{font-size:15px; color:var(--garn-blau); font-weight:600; padding:6px 2px}
  .sheet-body{flex:1; overflow-y:auto; padding:16px 18px 40px}

  /* Blatt von unten */
  .blatt{position:fixed; inset:0; z-index:45; display:none; align-items:flex-end; background:rgba(20,22,26,.42)}
  .blatt.offen{display:flex}
  .blatt-inhalt{width:100%; max-height:82vh; overflow-y:auto; background:var(--stoff); border-radius:18px 18px 0 0; padding:18px 18px 28px}
  .blatt-inhalt h3{margin:0; font-family:Georgia,serif; font-style:italic; font-size:19px; font-weight:600}
  .blatt-inhalt .klein{margin:2px 0 12px; font-size:12.5px; color:var(--tinte-2)}
  .b-option{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:12px 14px; border-radius:12px; background:var(--karte);
    border:1px solid var(--linie); margin-top:8px; font-size:15px;
  }
  .b-option.aktiv{border-color:var(--garn-blau); color:var(--garn-blau); font-weight:600}
  .b-option.warn{color:var(--beere); border-color:#e3c2c7}
  .b-option .haken{margin-left:auto; color:var(--garn-blau)}
  .b-neu{display:flex; gap:8px; margin-top:16px}
  .b-neu input{flex:1; min-width:0; padding:11px 12px; border:1px solid var(--linie); border-radius:10px; font:inherit; background:var(--karte); color:var(--tinte)}
  .b-neu button{flex:0 0 auto; padding:11px 16px; border-radius:10px; background:var(--garn-blau); color:#fff; font-weight:600}

  /* ── Formular ─────────────────────────── */
  .feld{margin-bottom:16px}
  .feld label, .feld-titel{display:block; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--tinte-2); margin-bottom:6px}
  .feld input[type=text], .feld input[type=date], .feld textarea{
    width:100%; padding:11px 12px; font:inherit; color:var(--tinte);
    background:var(--karte); border:1px solid var(--linie); border-radius:10px;
  }
  .feld textarea{resize:vertical; min-height:66px}
  .feld-reihe{display:flex; gap:12px}
  .feld-reihe .feld{flex:1; min-width:0}
  .hinweis{font-size:12px; color:var(--tinte-2); margin-top:5px}

  .wahl-chips{display:flex; flex-wrap:wrap; gap:7px}
  .wahl-chip{
    padding:8px 12px; border-radius:999px; border:1px solid var(--linie); background:var(--karte);
    font-size:13.5px; color:var(--tinte-2); display:inline-flex; align-items:center; gap:6px;
  }
  .wahl-chip.aktiv{background:var(--wf, var(--tinte)); border-color:var(--wf, var(--tinte)); color:#fff; font-weight:600; border-style:solid}
  .wahl-chip.sonst{border-style:dashed; color:var(--garn-blau)}

  .status-schalter{display:flex; gap:6px; flex-wrap:wrap}
  .status-knopf{
    flex:1 1 0; padding:10px 4px; border-radius:10px; font-size:13px;
    border:1px solid var(--linie); background:var(--karte); color:var(--tinte-2);
    display:flex; align-items:center; justify-content:center; gap:7px; min-width:92px;
  }
  .status-knopf .punkt{width:9px; height:9px; border-radius:50%; background:var(--sf)}
  .status-knopf.aktiv{background:var(--sf); border-color:var(--sf); color:#fff; font-weight:600}
  .status-knopf.aktiv .punkt{background:#fff}

  .foto-reihe{display:flex; gap:10px; flex-wrap:wrap}
  .foto-kachel{position:relative; width:76px; height:76px}
  .foto-kachel img{width:100%; height:100%; object-fit:cover; border-radius:10px; display:block}
  .foto-x{position:absolute; top:-7px; right:-7px; width:24px; height:24px; border-radius:50%; background:var(--tinte); color:#fff; font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center}
  .foto-plus{width:76px; height:76px; border-radius:10px; border:2px dashed var(--garn-blau); color:var(--garn-blau); font-size:26px; display:flex; align-items:center; justify-content:center; background:var(--karte); opacity:.85}

  .knopf{width:100%; padding:14px; border-radius:12px; font-size:16px; font-weight:600; background:var(--garn-blau); color:#fff; margin-top:6px}
  .knopf.leise{background:var(--karte); color:var(--tinte); border:1px solid var(--linie); font-weight:500}
  .knopf.rot{background:transparent; color:var(--beere); border:1px solid #e3c2c7}
  .knopf:active{opacity:.85}

  .detail-block{background:var(--karte); border-radius:var(--radius); box-shadow:var(--schatten); padding:14px 16px; margin-bottom:14px}
  .d-zeile{display:flex; gap:12px; padding:7px 0; border-bottom:1px dashed var(--linie)}
  .d-zeile:last-child{border-bottom:none}
  .d-label{flex:0 0 108px; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--tinte-2); padding-top:2px}
  .d-wert{flex:1; min-width:0; overflow-wrap:break-word; white-space:pre-line}
  .d-wert.warnung{color:var(--lila); font-weight:600}
  .detail-fotos{display:flex; gap:10px; flex-wrap:wrap}
  .detail-fotos img{width:104px; height:104px; object-fit:cover; border-radius:10px}

  .viewer{position:fixed; inset:0; z-index:50; background:rgba(20,22,26,.93); display:none; align-items:center; justify-content:center; padding:20px}
  .viewer.offen{display:flex}
  .viewer img{max-width:100%; max-height:100%; border-radius:8px}

  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
    background:var(--tinte); color:#fff; font-size:14px; padding:10px 18px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:80; max-width:86vw; text-align:center;
  }
  .toast.zeig{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>

<header class="kopf">
  <h1>Stickaufträge</h1>
  <p class="unterzeile" id="zusammenfassung">&nbsp;</p>
</header>
<div class="laufstich" aria-hidden="true"></div>

<nav class="chips" id="chips" aria-label="Nach Status filtern"></nav>
<div class="werkzeuge">
  <button class="wz" id="wzSortieren">↕ Sortieren: <b id="sortLabel">Deadline</b></button>
  <button class="wz stark" id="wzNeuerOrdner">+ Neuer Ordner</button>
  <button class="wz" id="wzDaten" aria-label="Daten sichern und laden">⤓ Daten</button>
  <button class="wz stark" id="wzInstallieren" type="button" hidden><img src="./icon-192-v6.png" width="20" height="20" alt="" aria-hidden="true">App installieren</button>
</div>
<input type="file" id="fImport" accept="application/json,.json" hidden>

<main class="liste" id="liste"></main>

<div class="leer" id="leer" hidden>
  <div class="rahmen" aria-hidden="true"><div class="innen"></div></div>
  <p>Noch keine Aufträge im Rahmen.</p>
  <p class="klein">Tippe auf +, um den ersten anzulegen.</p>
</div>

<button class="fab" id="fabNeu" aria-label="Neuen Auftrag anlegen">+</button>

<!-- ── Formular ── -->
<section class="sheet" id="sheetForm" aria-label="Auftrag bearbeiten">
  <div class="sheet-kopf">
    <button class="zurueck" data-akt="form-zu">‹ Zurück</button>
    <h2 id="formTitel">Neuer Auftrag</h2>
  </div>
  <div class="sheet-body">

    <div class="feld">
      <label for="fPerson">Für wen</label>
      <input type="text" id="fPerson" placeholder="Name" autocomplete="off">
    </div>

    <div class="feld">
      <label for="fOrdner">Ordner</label>
      <input type="text" id="fOrdner" list="ordnerListe" placeholder="z. B. Hochzeit Larissa &amp; Peter – leer lassen für Einzelstück" autocomplete="off">
      <datalist id="ordnerListe"></datalist>
    </div>

    <div class="feld">
      <label for="fMotiv">Motiv – was wird gestickt</label>
      <textarea id="fMotiv"></textarea>
    </div>

    <div class="feld">
      <span class="feld-titel">Status</span>
      <div class="status-schalter" id="formStatusSchalter"></div>
    </div>

    <div class="feld">
      <span class="feld-titel">Fotos (Vorlage, Skizze, Ergebnis)</span>
      <div class="foto-reihe" id="fotoReihe"></div>
      <input type="file" id="fFotos" accept="image/*" multiple hidden>
      <p class="hinweis">Bis zu 4 Fotos, werden automatisch verkleinert.</p>
    </div>

    <div class="feld">
      <span class="feld-titel">Garnfarbe</span>
      <div class="wahl-chips" id="garnChips"></div>
      <div id="garnWrap" hidden style="margin-top:9px">
        <input type="text" id="fGarn" autocomplete="off">
      </div>
    </div>

    <div class="feld-reihe">
      <div class="feld">
        <label for="fTextil">Textil</label>
        <input type="text" id="fTextil" list="textilListe" autocomplete="off">
        <datalist id="textilListe"></datalist>
      </div>
      <div class="feld">
        <label for="fTextilFarbe">Farbe Textil</label>
        <input type="text" id="fTextilFarbe" autocomplete="off">
      </div>
    </div>

    <div class="feld" id="groesseFeld" hidden>
      <span class="feld-titel">Größe &amp; Schnitt</span>
      <div class="wahl-chips" id="groesseChips"></div>
      <div class="wahl-chips" id="schnittChips" style="margin-top:8px"></div>
    </div>

    <div class="feld">
      <span class="feld-titel">Platzierung</span>
      <div class="wahl-chips" id="platzChips"></div>
      <div id="platzSonstWrap" hidden style="margin-top:9px">
        <input type="text" id="fPlatzSonst" placeholder="Platzierung frei eintippen …" autocomplete="off">
      </div>
    </div>

    <div class="feld-reihe">
      <div class="feld">
        <label for="fDatum">Auftrag vom</label>
        <input type="date" id="fDatum">
      </div>
      <div class="feld">
        <label for="fDeadline">Deadline</label>
        <input type="date" id="fDeadline">
      </div>
    </div>
    <p class="hinweis" id="fristHinweis" style="margin:-10px 0 16px"></p>

    <div class="feld">
      <span class="feld-titel">Bezahlung</span>
      <div class="wahl-chips" id="zahlChips"></div>
      <div id="betragWrap" style="margin-top:9px">
        <input type="text" id="fBetrag" placeholder="Betrag, z. B. 25 € (optional)" autocomplete="off">
      </div>
    </div>

    <div class="feld">
      <label for="fNotiz">Notizen</label>
      <textarea id="fNotiz" placeholder="z. B. Unterlegstiche prüfen, Vlies nicht vergessen …"></textarea>
    </div>

    <button class="knopf" id="btnSpeichern">Auftrag speichern</button>
    <p class="hinweis" id="formFehler" style="color:var(--beere)"></p>
  </div>
</section>

<!-- ── Detail ── -->
<section class="sheet" id="sheetDetail" aria-label="Auftragsdetails">
  <div class="sheet-kopf">
    <button class="zurueck" data-akt="detail-zu">‹ Zurück</button>
    <h2 id="detailTitel">Auftrag</h2>
  </div>
  <div class="sheet-body" id="detailBody"></div>
</section>

<div class="blatt" id="blatt"><div class="blatt-inhalt" id="blattInhalt"></div></div>
<div class="viewer" id="viewer"><img id="viewerBild" alt="Foto in groß"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";


/* ── Stammdaten ────────────────────────── */
const STATUS = {
  offen:      { label:"Offen",     farbe:"#c99a3a", hell:"#dcb15c" },

const hatCloud = typeof window.storage !== "undefined" && window.storage;
async function spLies(key){
  try{
    if(hatCloud){ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; }
    const v = localStorage.getItem(key); return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
async function spSchreib(key, wert){
  const s = JSON.stringify(wert);
  if(hatCloud){ await window.storage.set(key, s); } else { localStorage.setItem(key, s); }
}
async function spLoesch(key){
  try{ if(hatCloud){ await window.storage.delete(key); } else { localStorage.removeItem(key); } }catch(e){}
}

const $ = id => document.getElementById(id);
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function heuteISO(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtDatum(iso){ if(!iso) return "–"; const p = iso.split("-"); return p[2] + "." + p[1] + "." + p[0]; }
function fmtKurz(iso){ if(!iso) return ""; const p = iso.split("-"); return p[2] + "." + p[1] + "."; }
function tageBis(iso){
  const heute = new Date(); heute.setHours(0,0,0,0);
  return Math.round((new Date(iso + "T00:00:00") - heute) / 86400000);
}
function istAktiv(a){ return a.status === "offen"; }
/* Erledigt = übergeben UND bezahlt; bei Geschenken reicht übergeben */
function istErledigt(a){
  return a.status === "uebergeben" && (a.zahlung === "gezahlt" || a.zahlung === "geschenk");
}
function fristInfo(a){
  if(!istAktiv(a)) return null;
  if(!a.deadline) return { text:"Keine Deadline", klasse:"keine-frist" };
  const t = tageBis(a.deadline);
  if(t < 0)   return { text:(t === -1 ? "1 Tag überfällig" : Math.abs(t) + " Tage überfällig"), klasse:"frist-rot" };
  if(t === 0) return { text:"heute fällig", klasse:"frist-rot" };
  if(t === 1) return { text:"morgen fällig", klasse:"frist-warn" };
  if(t <= 7)  return { text:"noch " + t + " Tage · " + fmtKurz(a.deadline), klasse:"frist-warn" };
  return { text:"bis " + fmtDatum(a.deadline), klasse:"frist-ok" };
}
function garnText(a){
  if(a.garnArt === "mehrfarbig") return "Mehrfarbig" + (a.garn ? " · " + a.garn : "");
  if(a.garnArt === "einfarbig")  return a.garn || "Einfarbig";
  return a.garn || "";
}
function toast(txt){
  const t = $("toast");
  t.textContent = txt; t.classList.add("zeig");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("zeig"), 2200);
}

/* ── Sortieren ─────────────────────────── */
function sortSchluessel(a){
  const stGruppe = a.status === "offen" ? 0 : (a.status === "fertig" ? 1 : 2);
  const name = (a.person || "").toLowerCase();
  switch(sortId){
    case "neueste":  return "9|" + (9999999999999 - new Date((a.datum || "1970-01-01") + "T00:00:00").getTime()).toString().padStart(14,"0") + "|" + name;
    case "aelteste": return "9|" + (a.datum || "9999-99-99") + "|" + name;
    case "status":   return stGruppe + "|" + (a.deadline || "9999-99-99") + "|" + name;
    case "name":     return "9|" + name + "|" + (a.datum || "");
    default:         return stGruppe + "|" + (a.deadline || "9999-99-99") + "|" + (a.datum || "");
  }
}
function sortiert(liste){
  return liste.slice().sort((x,y) => {
    const sx = sortSchluessel(x), sy = sortSchluessel(y);
    return sx < sy ? -1 : (sx > sy ? 1 : 0);
  });
}

          (unter ? '<span class="banderole">' + esc(unter) + '</span>' : '') +

            (garn ? '<span class="marke">🧵 ' + esc(garn) + '</span>' : '') +
            (a.fotoAnzahl ? '<span class="marke">📷 ' + a.fotoAnzahl + '</span>' : '') +

        '</button>' +

          '<button class="akt-knopf" data-statuszyklus="' + a.id + '" style="color:' + st.farbe + '"><span class="punkt"></span>' + st.label + '</button>' +

        '</div>' +

      (a.vorschau ? '<img class="thumb" src="' + a.vorschau + '" alt="">' : '') +
    '</div>'
  );
}

function ordnerHtml(name, posten, art){
  const zu = zuOrdner.indexOf(name) !== -1;
  const archiv = art === "archiv";
  const info = archiv
    ? posten.length + " Stück · abgeschlossen"
    : (posten.length ? posten.length + " Stück" + (posten.filter(istAktiv).length ? " · " + posten.filter(istAktiv).length + " offen" : " · fertig") : "leer");
  const zielWert = art === "eigen" ? name : (art === "ohne" ? "" : null);

  let html = '<section class="ordner' + (archiv ? ' erledigt' : '') + '">' +
    '<div class="ordner-kopf">' +
      '<button class="ordner-titel" data-falten="' + esc(name) + '">' +
        '<span class="ordner-pfeil">' + (zu ? "▸" : "▾") + '</span>' +
        '<span class="ordner-name">' + esc(name) + '</span>' +
        '<span class="ordner-zahl">' + esc(info) + '</span>' +
      '</button>' +
      (art === "eigen" ? '<button class="ordner-mehr" data-ordnermehr="' + esc(name) + '" aria-label="Ordner bearbeiten">⋯</button>' : '') +
    '</div><div class="ordner-linie"></div>';

  if(!zu){
    html += '<div class="ordner-inhalt"' + (zielWert !== null ? ' data-dropziel="' + esc(zielWert) + '"' : '') + '>';
    html += posten.length
      ? posten.map(a => karteHtml(a, archiv)).join("")
      : (zielWert !== null ? '<div class="ordner-leer">Noch leer – zieh eine Karte am ⠿ hierher</div>' : '');
    html += '</div>';
  }
  return html + '</section>';
}

function renderListe(){
  const gefiltert = auftraege.filter(a => filter === "alle" ? true : a.status === filter);
  const geordnet = sortiert(gefiltert);
  $("leer").hidden = auftraege.length > 0;

  const offenN = auftraege.filter(istAktiv).length;
  const ohneFrist = auftraege.filter(a => istAktiv(a) && !a.deadline).length;
  const unbezahlt = auftraege.filter(a => a.zahlung === "offen" && a.status !== "offen").length;
  let zus;
  if(auftraege.length === 0) zus = "Dein Überblick über alle Stickprojekte";
  else if(offenN === 0) zus = "Alles fertig – nichts offen 🎉";
  else{
    zus = offenN + (offenN === 1 ? " offener Auftrag" : " offene Aufträge");
    if(ohneFrist) zus += " · " + ohneFrist + " ohne Deadline";
  }
  if(unbezahlt) zus += " · " + unbezahlt + " noch nicht gezahlt";
  $("zusammenfassung").textContent = zus;

  /* Bei aktivem Status-Filter bleibt alles sichtbar, sonst wandert Erledigtes ins Archiv */
  const archivTrennen = filter === "alle";
  const laufend = archivTrennen ? geordnet.filter(a => !istErledigt(a)) : geordnet;
  const archiv  = archivTrennen ? geordnet.filter(istErledigt) : [];

  let html = "";
  for(const o of ordner){
    html += ordnerHtml(o, laufend.filter(a => (a.ordner || "").trim() === o), "eigen");
  }
  const ohne = laufend.filter(a => !(a.ordner || "").trim());
  if(ohne.length || ordner.length){
    html += ordnerHtml(OHNE, ohne, "ohne");
  }
  if(archiv.length) html += ordnerHtml(ERLEDIGT, archiv, "archiv");
  $("liste").innerHTML = html;
}
function renderAlles(){ renderChips(); renderListe(); }

/* ── Ordner verwalten ──────────────────── */
async function ordnerAnlegen(name){
  const n = String(name || "").trim();
  if(!n) return false;
  if(n === ERLEDIGT || n === OHNE){ toast("Dieser Name ist vergeben"); return false; }
  if(ordner.indexOf(n) !== -1){ toast("Ordner gibt es schon"); return false; }
  ordner.push(n);
  await ordnerSichern();
  renderAlles();
  toast("Ordner „" + n + "“ angelegt");
  return true;
}
async function ordnerUmbenennen(alt, neu){
  const n = String(neu || "").trim();
  if(!n || n === alt) return;
  if(ordner.indexOf(n) !== -1){ toast("Ordner gibt es schon"); return; }
  ordner[ordner.indexOf(alt)] = n;
  for(const a of auftraege) if((a.ordner || "").trim() === alt) a.ordner = n;
  const i = zuOrdner.indexOf(alt); if(i !== -1) zuOrdner[i] = n;
  await ordnerSichern(); await spSchreib(INDEX_KEY, auftraege); await ansichtSichern();
  renderAlles();
  toast("Umbenannt in „" + n + "“");
}
async function ordnerLoeschen(name){
  ordner = ordner.filter(o => o !== name);
  let betroffen = 0;
  for(const a of auftraege) if((a.ordner || "").trim() === name){ a.ordner = ""; betroffen++; }
  await ordnerSichern(); await spSchreib(INDEX_KEY, auftraege);
  renderAlles();
  toast(betroffen ? "Ordner gelöscht, " + betroffen + " Aufträge bleiben erhalten" : "Ordner gelöscht");
}
async function ordnerZuweisen(id, name){
  const a = auftraege.find(x => x.id === id);
  if(!a) return;
  const n = String(name || "").trim();
  if((a.ordner || "") === n) return;
  a.ordner = n;
  if(n && ordner.indexOf(n) === -1){ ordner.push(n); await ordnerSichern(); }
  await spSchreib(INDEX_KEY, auftraege);
  renderAlles(); frischMarkieren(id);
  toast(n ? "In „" + n + "“ verschoben" : "Aus dem Ordner genommen");
}

/* ── Sicherung: alles in eine Datei und zurück ── */
async function datenExportieren(){
  const paket = {
    typ:"stickauftraege", version:1, erstellt:new Date().toISOString(),
    auftraege, ordner, ansicht:{ sortId, zuOrdner }, fotos:{}
  };
  for(const a of auftraege){
    if(!a.fotoAnzahl) continue;
    const f = await spLies("stick-fotos-" + a.id);
    if(Array.isArray(f) && f.length) paket.fotos[a.id] = f;
  }
  const blob = new Blob([JSON.stringify(paket)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "stickauftraege-" + heuteISO() + ".json";
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  blattSchliessen();
  toast("Sicherung gespeichert ✓");
}
async function datenImportieren(datei){
  let paket;
  try{ paket = JSON.parse(await datei.text()); }
  catch(e){ toast("Datei nicht lesbar"); return; }
  if(!paket || !Array.isArray(paket.auftraege)){ toast("Das ist keine Sicherung dieser App"); return; }
  auftraege = paket.auftraege;
  ordner = Array.isArray(paket.ordner) ? paket.ordner : [];
  if(paket.ansicht){
    if(paket.ansicht.sortId && SORTIERUNGEN.some(s => s.id === paket.ansicht.sortId)) sortId = paket.ansicht.sortId;
    if(Array.isArray(paket.ansicht.zuOrdner)) zuOrdner = paket.ansicht.zuOrdner;
  }
  const fotos = paket.fotos || {};
  for(const id in fotos){ try{ await spSchreib("stick-fotos-" + id, fotos[id]); }catch(e){} }
  migrieren();
  await spSchreib(INDEX_KEY, auftraege);
  await ordnerSichern(); await ansichtSichern();
  blattSchliessen(); renderAlles();
  toast(auftraege.length + " Aufträge geladen ✓");
}

let zieh = null;
function ziehStart(e, id, griff){
  if(e.button !== undefined && e.button !== 0) return;
  zieh = { id, griff, x0:e.clientX, y0:e.clientY, aktiv:false, klon:null, ziel:null, zielEl:null, rollen:0 };
  try{ griff.setPointerCapture(e.pointerId); }catch(err){}
}
function ziehBewegen(e){
  if(!zieh) return;
  const dx = e.clientX - zieh.x0, dy = e.clientY - zieh.y0;
  if(!zieh.aktiv){
    if(Math.sqrt(dx*dx + dy*dy) < 10) return;
    const karte = zieh.griff.closest(".karte");
    if(!karte){ zieh = null; return; }
    const r = karte.getBoundingClientRect();
    const klon = karte.cloneNode(true);
    klon.classList.add("zieh");
    klon.style.width = r.width + "px";
    klon.style.left = r.left + "px";
    klon.style.top = r.top + "px";
    document.body.appendChild(klon);
    zieh.klon = klon;
    zieh.gx = zieh.x0 - r.left;
    zieh.gy = zieh.y0 - r.top;
    karte.classList.add("zieh-quelle");
    zieh.quelle = karte;
    zieh.aktiv = true;
    rollenSchleife();
  }
  e.preventDefault();
  zieh.klon.style.left = (e.clientX - zieh.gx) + "px";
  zieh.klon.style.top  = (e.clientY - zieh.gy) + "px";

  const rand = 90;
  zieh.rollen = e.clientY < rand ? -14 : (e.clientY > window.innerHeight - rand ? 14 : 0);

  const unter = document.elementFromPoint(e.clientX, e.clientY);
  const zielEl = unter ? unter.closest("[data-dropziel]") : null;
  if(zielEl !== zieh.zielEl){
    if(zieh.zielEl) zieh.zielEl.classList.remove("drueber");
    zieh.zielEl = zielEl;
    if(zielEl){ zielEl.classList.add("drueber"); zieh.ziel = zielEl.getAttribute("data-dropziel"); }
    else zieh.ziel = null;
  }
}
function rollenSchleife(){
  if(!zieh || !zieh.aktiv) return;
  if(zieh.rollen) window.scrollBy(0, zieh.rollen);
  requestAnimationFrame(rollenSchleife);
}
function ziehEnde(){
  if(!zieh) return;
  const { id, aktiv, ziel } = zieh;
  if(zieh.klon) zieh.klon.remove();
  if(zieh.quelle) zieh.quelle.classList.remove("zieh-quelle");
  if(zieh.zielEl) zieh.zielEl.classList.remove("drueber");
  zieh = null;
  if(!aktiv){ blattOeffnen("zuweisen", id); return; }
  if(ziel !== null) ordnerZuweisen(id, ziel);
}

function bildVerkleinern(datei){
  return new Promise((resolve, reject) => {
    const leser = new FileReader();
    leser.onerror = () => reject(new Error("Lesefehler"));
    leser.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Kein Bild"));
      img.onload = () => {
        const max = 900;
        let w = img.width, h = img.height;
        if(w > max || h > max){ const f = max / Math.max(w,h); w = Math.round(w*f); h = Math.round(h*f); }
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL("image/jpeg", 0.72));
      };
      img.src = leser.result;
    };
    leser.readAsDataURL(datei);
  });
}
async function fotosHinzufuegen(dateien){
  for(const d of dateien){
    if(formFotos.length >= 4) break;
    try{ formFotos.push(await bildVerkleinern(d)); }
    catch(e){ toast("Ein Foto konnte nicht geladen werden"); }
  }
  renderFotoReihe();
}
function thumbAus(dataUrl){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const max = 260;
      let w = img.width, h = img.height;
      if(w > max || h > max){ const f = max / Math.max(w,h); w = Math.round(w*f); h = Math.round(h*f); }
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#f3f4f1"; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = () => resolve("");
    img.src = dataUrl;
  });
}

async function speichern(){
  const person = $("fPerson").value.trim();
  const motiv  = $("fMotiv").value.trim();
  if(!person && !motiv){ $("formFehler").textContent = "Mindestens Person oder Motiv angeben."; return; }

  const btn = $("btnSpeichern");
  btn.disabled = true;
  await formFotosLaden;

  const id = bearbeiteId || neueId();
  const kleidung = istKleidung($("fTextil").value);
  const ordnerName = $("fOrdner").value.trim();
  const eintrag = {
    id,
    person: person || "Ohne Namen",
    ordner:      ordnerName,
    motiv,
    garnArt,
    garn:        garnArt ? $("fGarn").value.trim() : "",
    textil:      $("fTextil").value.trim(),
    textilFarbe: $("fTextilFarbe").value.trim(),
    groesse:     kleidung ? formGroesse : "",
    schnitt:     kleidung ? formSchnitt : "",
    platzierung: platzSonst ? $("fPlatzSonst").value.trim() : platzWert,
    datum:       $("fDatum").value || heuteISO(),
    deadline:    $("fDeadline").value || "",
    status:      formStatus,
    zahlung:     formZahlung,
    betrag:      formZahlung === "geschenk" ? "" : $("fBetrag").value.trim(),
    notiz:       $("fNotiz").value.trim(),
    fotoAnzahl:  formFotos.length,
    vorschau:    ""
  };

  try{
    if(formFotos.length){
      eintrag.vorschau = await thumbAus(formFotos[0]);
      await spSchreib("stick-fotos-" + id, formFotos);
    }else{
      await spLoesch("stick-fotos-" + id);
    }
    const i = auftraege.findIndex(x => x.id === id);
    if(i >= 0) auftraege[i] = eintrag; else auftraege.push(eintrag);
    if(ordnerName && ordner.indexOf(ordnerName) === -1){ ordner.push(ordnerName); await ordnerSichern(); }
    await spSchreib(INDEX_KEY, auftraege);

    const warBearbeitung = !!bearbeiteId;
    formSchliessen(); detailSchliessen();
    frischId = id;
    renderAlles();
    window.scrollTo({ top:0, behavior:"smooth" });
    frischMarkieren(id);
    toast(warBearbeitung ? "Auftrag aktualisiert ✓" : "Auftrag gespeichert ✓");
  }catch(e){
    $("formFehler").textContent = "Speichern hat nicht geklappt – bitte nochmal versuchen.";
  }finally{
    btn.disabled = false;
  }
}

  detailInfosAktualisieren(a);
  await spSchreib(INDEX_KEY, auftraege);
  renderAlles();
  toast(neu === "geschenk" ? "Als Geschenk markiert" : (neu === "gezahlt" ? "Als gezahlt markiert" : "Als offen markiert"));
}
async function statusZyklus(id){
  const a = auftraege.find(x => x.id === id);
  if(!a) return;
  a.status = STATUS_REIHE[(STATUS_REIHE.indexOf(a.status) + 1) % STATUS_REIHE.length];
  await spSchreib(INDEX_KEY, auftraege);
  renderAlles(); frischMarkieren(id);
  toast("Status: " + STATUS[a.status].label);
}
async function zahlungZyklus(id){
  const a = auftraege.find(x => x.id === id);
  if(!a) return;
  a.zahlung = ZAHLUNG_REIHE[(ZAHLUNG_REIHE.indexOf(a.zahlung || "offen") + 1) % ZAHLUNG_REIHE.length];
  if(a.zahlung === "geschenk") a.betrag = "";
  await spSchreib(INDEX_KEY, auftraege);
  renderAlles(); frischMarkieren(id);
  toast(a.zahlung === "geschenk" ? "🎁 Geschenk" : (a.zahlung === "gezahlt" ? "Als gezahlt markiert" : "Als nicht gezahlt markiert"));
}
async function loeschen(){
  const btn = $("btnLoeschen");
  if(btn.dataset.sicher !== "1"){
    btn.dataset.sicher = "1";
    btn.textContent = "Wirklich löschen? Nochmal tippen";
    setTimeout(() => { if(btn.isConnected){ btn.dataset.sicher = ""; btn.textContent = "Auftrag löschen"; } }, 3000);
    return;
  }
  const id = detailId;
  auftraege = auftraege.filter(x => x.id !== id);
  await spSchreib(INDEX_KEY, auftraege);
  await spLoesch("stick-fotos-" + id);
  detailSchliessen(); renderAlles();
  toast("Auftrag gelöscht");
}

/* ── Ereignisse ────────────────────────── */
document.addEventListener("pointerdown", e => {

  if(griff) ziehStart(e, griff.dataset.griff, griff);
});
document.addEventListener("pointermove", ziehBewegen, { passive:false });
document.addEventListener("pointerup", ziehEnde);
document.addEventListener("pointercancel", ziehEnde);

document.addEventListener("click", e => {
  const t = e.target.closest("button, img[data-gross]");
  if(!t){ if(e.target.id === "viewer") $("viewer").classList.remove("offen"); return; }
  if(t.hasAttribute("data-griff")) return;   /* wird beim Loslassen behandelt */

  if(t.dataset.filter){ filter = t.dataset.filter; renderAlles(); return; }
  if(t.id === "wzSortieren"){ blattOeffnen("sort"); return; }
  if(t.id === "wzNeuerOrdner"){ blattOeffnen("neu"); return; }
  if(t.id === "wzDaten"){ blattOeffnen("daten"); return; }
  if(t.id === "wzInstallieren"){ appInstallieren(); return; }
  if(t.id === "pwaPruefen"){ pwaInstallationPruefen(); return; }
  if(t.id === "pwaHilfeSchliessen"){ blattSchliessen(); return; }
  if(t.dataset.daten === "export"){ datenExportieren(); return; }
  if(t.dataset.daten === "import"){
    if(t.dataset.sicher !== "1"){
      t.dataset.sicher = "1"; t.textContent = "Ersetzt alles – nochmal tippen";
      setTimeout(() => { if(t.isConnected){ t.dataset.sicher = ""; t.textContent = "⤒ Sicherung laden"; } }, 3500);
      return;
    }
    $("fImport").click(); return;
  }
  if(t.dataset.sortwahl){
    sortId = t.dataset.sortwahl;
    blattSchliessen(); renderAlles(); ansichtSichern();
    toast("Sortiert nach " + SORTIERUNGEN.find(s => s.id === sortId).label);
    return;
  }
  if(t.hasAttribute("data-owahl")){
    const id = blattDaten; const wahl = t.getAttribute("data-owahl");
    blattSchliessen(); ordnerZuweisen(id, wahl); return;
  }
  if(t.hasAttribute("data-blattok")){ blattBestaetigen(); return; }
  if(t.dataset.oloeschen){
    const name = t.dataset.oloeschen;
    if(t.dataset.sicher !== "1"){
      t.dataset.sicher = "1"; t.textContent = "Wirklich löschen? Nochmal tippen";
      setTimeout(() => { if(t.isConnected){ t.dataset.sicher = ""; t.textContent = "Ordner löschen (Aufträge bleiben)"; } }, 3000);
      return;
    }
    blattSchliessen(); ordnerLoeschen(name); return;
  }
  if(t.dataset.ordnermehr){ blattOeffnen("ordner", t.dataset.ordnermehr); return; }
  if(t.dataset.falten){
    const n = t.dataset.falten;
    const i = zuOrdner.indexOf(n);
    if(i === -1) zuOrdner.push(n); else zuOrdner.splice(i,1);
    renderListe(); ansichtSichern(); return;
  }
  if(t.dataset.statuszyklus){ statusZyklus(t.dataset.statuszyklus); return; }
  if(t.dataset.zahlzyklus){ zahlungZyklus(t.dataset.zahlzyklus); return; }
  if(t.dataset.detail){ detailZeigen(t.dataset.detail); return; }
  if(t.id === "fabNeu"){ formOeffnen(null); return; }
  if(t.dataset.akt === "form-zu"){ formSchliessen(); return; }
  if(t.dataset.akt === "detail-zu"){ detailSchliessen(); return; }
  if(t.dataset.akt === "bearbeiten"){ formOeffnen(detailId); return; }
  if(t.id === "btnSpeichern"){ speichern(); return; }
  if(t.id === "btnLoeschen"){ loeschen(); return; }
  if(t.id === "fotoPlus"){ $("fFotos").click(); return; }
  if(t.dataset.fotoweg !== undefined){ formFotos.splice(Number(t.dataset.fotoweg),1); renderFotoReihe(); return; }
  if(t.dataset.fstatus){ formStatus = t.dataset.fstatus; renderFormStatus(); return; }
  if(t.dataset.garnart){
    garnArt = (garnArt === t.dataset.garnart) ? "" : t.dataset.garnart;
    renderGarn(); if(garnArt) $("fGarn").focus(); return;
  }
  if(t.dataset.groesse){ formGroesse = (formGroesse === t.dataset.groesse) ? "" : t.dataset.groesse; renderGroesse(); return; }
  if(t.dataset.schnitt){ formSchnitt = (formSchnitt === t.dataset.schnitt) ? "" : t.dataset.schnitt; renderGroesse(); return; }
  if(t.dataset.platz){
    platzSonst = false;
    platzWert = (platzWert === t.dataset.platz) ? "" : t.dataset.platz;
    renderPlatz(); return;
  }
  if(t.dataset.platzSonst){
    platzSonst = true;
    if(PLATZ_VORGABEN.indexOf(platzWert) !== -1) platzWert = "";
    renderPlatz();
    const inp = $("fPlatzSonst"); inp.value = platzWert; inp.focus();
    return;
  }
  if(t.dataset.zahlung){ formZahlung = t.dataset.zahlung; renderZahlung(); return; }
  if(t.dataset.dzahl){ zahlungSetzen(t.dataset.dzahl); return; }
  if(t.dataset.status){ statusSetzen(t.dataset.status); return; }
  if(t.dataset.gross !== undefined){
    const box = $("detailFotos");
    $("viewerBild").src = (box && box._fotos) ? box._fotos[Number(t.dataset.gross)] : t.src;
    $("viewer").classList.add("offen");
    return;
  }
});

/* ── PWA-Installation und Updates ───────── */
let pwaInstallPrompt = null;
let pwaInstallLaeuft = false;
let pwaInstallationBestaetigt = false;
let pwaPrueft = false;
let pwaPruefergebnis = [];
let pwaSWFehler = "";
const pwaAndroid = /Android/i.test(navigator.userAgent);
const pwaIOS = /iPad|iPhone|iPod/i.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const pwaDarstellung = window.matchMedia("(display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui)");

function pwaIstApp(){
  return pwaInstallationBestaetigt || pwaDarstellung.matches || navigator.standalone === true;
}
function pwaInstallKnopfAktualisieren(){
  const b = $("wzInstallieren");
  if(!b) return;
  b.hidden = pwaIstApp() || (!pwaAndroid && !pwaIOS && !pwaInstallPrompt);
  b.disabled = pwaInstallLaeuft;
}
function pwaPruefungHTML(){
  if(pwaPrueft) return "Installationsdateien werden geprüft …";
  if(!pwaPruefergebnis.length) return "Version 6 · Ohne Unterordner";
  return pwaPruefergebnis.map(e => '<p>' + esc(e) + '</p>').join("");
}
function pwaPruefungAnzeigen(){
  const ergebnis = $("pwaPruefergebnis");
  if(ergebnis) ergebnis.innerHTML = pwaPruefungHTML();
  const knopf = $("pwaPruefen");
  if(knopf) knopf.disabled = pwaPrueft;
}
async function pwaDateiLesen(pfad, typ, groesse){
  const url = new URL(pfad, document.baseURI);
  if(url.origin !== location.origin) throw new Error("Datei liegt nicht auf dieser Website: " + pfad);
  url.searchParams.set("pwa-check", "v6");
  const steuerung = new AbortController();
  const timer = setTimeout(() => steuerung.abort(), 10000);
  const name = decodeURIComponent(url.pathname.split("/").pop());
  try{
    const antwort = await fetch(url.href, { cache:"no-store", signal:steuerung.signal });
    if(!antwort.ok) throw new Error(name + ": HTTP " + antwort.status + ". Datei fehlt oder ist noch nicht veröffentlicht.");
    const inhaltstyp = (antwort.headers.get("Content-Type") || "").toLowerCase();
    if(inhaltstyp.includes("text/html")) throw new Error(name + ": Statt der Datei wird eine HTML-Seite geliefert.");
    if(typ === "json"){
      try{ return await antwort.json(); }
      catch(fehler){ throw new Error(name + ": Kein gültiges JSON-Manifest."); }
    }
    if(typ === "bild"){
      if(!inhaltstyp.includes("image/png")) throw new Error(name + ": Wird nicht als PNG-Bild ausgeliefert.");
      const blob = await antwort.blob();
      if(typeof createImageBitmap === "function"){
        let bild;
        try{ bild = await createImageBitmap(blob); }
        catch(fehler){ throw new Error(name + ": Bild ist beschädigt oder kein PNG."); }
        const korrekt = bild.width === groesse && bild.height === groesse;
        bild.close();
        if(!korrekt) throw new Error(name + ": Falsche Bildgröße, erwartet " + groesse + " × " + groesse + " Pixel.");
      }
      return true;
    }
    if(!/(javascript|ecmascript)/.test(inhaltstyp)) throw new Error(name + ": Wird nicht als JavaScript ausgeliefert.");
    await antwort.text();
    return true;
  }catch(fehler){
    if(fehler.name === "AbortError") throw new Error(name + ": Server antwortet nicht rechtzeitig.");
    throw fehler;
  }finally{
    clearTimeout(timer);
  }
}
async function pwaInstallationPruefen(){
  if(pwaPrueft) return;
  pwaPrueft = true;
  pwaPruefergebnis = [];
  pwaPruefungAnzeigen();
  try{
    if(!/^https?:$/.test(location.protocol) || !window.isSecureContext){
      throw new Error("Die App muss über ihre veröffentlichte HTTPS-Website geöffnet werden.");
    }
    if(!navigator.onLine) throw new Error("Keine Internetverbindung. Die Installationsdateien können gerade nicht geprüft werden.");
    const manifest = await pwaDateiLesen("./manifest.webmanifest", "json");
    if(!manifest || !manifest.name || manifest.display !== "standalone" || !manifest.start_url){
      throw new Error("manifest.webmanifest: Die App-Angaben fehlen oder stammen nicht aus diesem Paket.");
    }
    const bilder = [
      ["./icon-192-v6.png", 192, "any"],
      ["./icon-512-v6.png", 512, "any"],
      ["./icon-maskable-192-v6.png", 192, "maskable"],
      ["./icon-maskable-512-v6.png", 512, "maskable"]
    ];
    if(!Array.isArray(manifest.icons) || !bilder.every(([src, n, zweck]) => manifest.icons.some(i =>
      i.src === src && i.sizes === n + "x" + n && (i.purpose || "any").split(/\s+/).includes(zweck)))){
      throw new Error("manifest.webmanifest ist nicht die passende Version 6. Auch diese Datei ersetzen, nicht nur index.html.");
    }
    const pruefungen = await Promise.all(bilder.map(async ([src, n]) => {
      try{ await pwaDateiLesen(src, "bild", n); return null; }
      catch(fehler){ return fehler.message || "Ein Symbol konnte nicht geladen werden."; }
    }));
    const fehler = pruefungen.filter(Boolean);
    if(fehler.length){
      pwaPruefergebnis = fehler.concat("Die genannten PNG-Dateien unverändert direkt neben index.html hochladen. Danach erneut prüfen.");
      return;
    }
    pwaPruefergebnis.push("✓ Manifest und alle vier Android-Symbole sind erreichbar. Version 6 ist veröffentlicht.");
    try{
      await pwaDateiLesen("./sw.js", "script");
      if(pwaSWFehler) pwaPruefergebnis.push("Offline-Funktion: " + pwaSWFehler);
      else if("serviceWorker" in navigator){
        const registrierung = await navigator.serviceWorker.getRegistration(new URL("./", document.baseURI).href);
        pwaPruefergebnis.push(registrierung && registrierung.active
          ? "✓ Offline-Service-Worker ist aktiv."
          : "Offline-Service-Worker ist noch nicht aktiv. Seite nach dem Hochladen erneut öffnen.");
      }
    }catch(fehler){ pwaPruefergebnis.push("Offline-Funktion: " + fehler.message); }
    pwaPruefergebnis.push(pwaInstallPrompt
      ? "Der Browser bietet die Installation an. Diesen Hinweis schließen und App installieren antippen."
      : "Die Dateien sind vorhanden. Falls kein Dialog erscheint, das Chrome-Menü verwenden. Diese Prüfung bestätigt keine abgeschlossene Android-Installation.");
  }catch(fehler){
    pwaPruefergebnis = [fehler.message || "Die Installationsdateien konnten nicht geprüft werden."];
  }finally{
    pwaPrueft = false;
    pwaPruefungAnzeigen();
  }
}

if("serviceWorker" in navigator && window.isSecureContext && /^https?:$/.test(location.protocol)){
  const pwaOfflineStarten = () => {
    navigator.serviceWorker.register("./sw.js?v=6", {
      scope: "./", updateViaCache: "none"
    }).catch(fehler => {
      pwaSWFehler = fehler.message || "Service Worker konnte nicht registriert werden.";
      console.warn("Offline-Funktion konnte nicht aktualisiert werden:", fehler);
    });
  };
  if(document.readyState === "complete") pwaOfflineStarten();
  else window.addEventListener("load", pwaOfflineStarten, { once:true });
}
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  pwaInstallPrompt = e;
  pwaInstallKnopfAktualisieren();
});
window.addEventListener("appinstalled", () => {
  pwaInstallationBestaetigt = true;
  pwaInstallPrompt = null;
  if(blattModus === "installieren") blattSchliessen();
  pwaInstallKnopfAktualisieren();
});
if(pwaDarstellung.addEventListener){
  pwaDarstellung.addEventListener("change", pwaInstallKnopfAktualisieren);
}else if(pwaDarstellung.addListener){
  pwaDarstellung.addListener(pwaInstallKnopfAktualisieren);
}
pwaInstallKnopfAktualisieren();

async function appInstallieren(){
  if(pwaInstallLaeuft || pwaIstApp()) return;
  if(!pwaInstallPrompt){
    blattOeffnen("installieren");
    pwaInstallationPruefen();
    return;
  }
  const prompt = pwaInstallPrompt;
  pwaInstallPrompt = null;
  pwaInstallLaeuft = true;
  pwaInstallKnopfAktualisieren();
  try{
    await prompt.prompt();
    const wahl = await prompt.userChoice;
    if(wahl.outcome === "accepted" && !pwaInstallationBestaetigt){
      toast("Installation im Browser angefordert");
    }
  }catch(fehler){
    console.warn("Installation konnte nicht gestartet werden:", fehler);
    blattOeffnen("installieren");
    pwaInstallationPruefen();
  }finally{
    pwaInstallLaeuft = false;
    pwaInstallKnopfAktualisieren();
  }
}

/* ── Start ─────────────────────────────── */
function migrieren(){
  let geaendert = false;
  for(const a of auftraege){
    if(a.status === "arbeit"){ a.status = "offen"; geaendert = true; }
    if(!a.zahlung){ a.zahlung = a.gezahlt ? "gezahlt" : "offen"; delete a.gezahlt; geaendert = true; }
    if(a.garn && !a.garnArt){ a.garnArt = "einfarbig"; geaendert = true; }
    if(a.gruppe !== undefined){ if(!a.ordner) a.ordner = a.gruppe; delete a.gruppe; geaendert = true; }
    if(a.ordner === undefined){ a.ordner = ""; geaendert = true; }
  }
  return geaendert;
}
(async function start(){
  datalistFuellen("textilListe", TEXTILIEN);
  rotAlleNeu();

  const ansicht = await spLies(ANSICHT_KEY);
  if(ansicht){
    if(ansicht.sortId && SORTIERUNGEN.some(s => s.id === ansicht.sortId)) sortId = ansicht.sortId;
    if(Array.isArray(ansicht.zuOrdner)) zuOrdner = ansicht.zuOrdner;
    else if(Array.isArray(ansicht.zuGruppen)) zuOrdner = ansicht.zuGruppen;
  }
  const gespeicherteOrdner = await spLies(ORDNER_KEY);
  if(Array.isArray(gespeicherteOrdner)) ordner = gespeicherteOrdner;

  const daten = await spLies(INDEX_KEY);
  if(Array.isArray(daten)) auftraege = daten;
  if(migrieren()){ try{ await spSchreib(INDEX_KEY, auftraege); }catch(e){} }

  /* Ordnernamen aus bestehenden Aufträgen übernehmen */
  let neu = false;
  for(const a of auftraege){
    const o = (a.ordner || "").trim();
    if(o && ordner.indexOf(o) === -1){ ordner.push(o); neu = true; }
  }
  if(neu) await ordnerSichern();

  renderAlles();
})();
