name: Supabase wach halten

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  anklopfen:
    runs-on: ubuntu-latest
    steps:
      - name: Kurz anklopfen
        run: |
          url="${{ secrets.SUPABASE_URL }}"
          key="${{ secrets.SUPABASE_KEY }}"
          echo "URL-Laenge: ${#url} Zeichen"
          echo "Key-Laenge: ${#key} Zeichen"
          if [ -z "$url" ]; then echo "FEHLER: SUPABASE_URL ist leer"; exit 1; fi
          if [ -z "$key" ]; then echo "FEHLER: SUPABASE_KEY ist leer"; exit 1; fi
          url="${url%/}"
          antwort=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$url/rest/v1/lebenszeichen?select=id" -H "apikey: $key")
          echo "Antwort: $antwort"
          test "$antwort" = "200"
